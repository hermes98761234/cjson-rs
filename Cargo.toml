[package]
name = "cjson"
version = "0.1.0"
edition = "2021"
description = "Idiomatic Rust rewrite of cJSON — ultralightweight JSON parser"
license = "MIT"
repository = "https://github.com/hermes98761234/cjson-rs"

[features]
default = ["std"]
std = []
utils = ["std"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"

[lib]
name = "cjson"
path = "src/lib.rs"
